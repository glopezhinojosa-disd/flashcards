<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#123b4a;
    --board-2:#0d2e3a;
    --panel:#1c4d5c;
    --ink:#eaf6f4;
    --ink-soft:#a9cdcf;
    --cardback:#f4a259;
    --cardback-2:#e8894a;
    --face:#fff9f0;
    --face-word:#fff2df;
    --word-ink:#123b4a;
    --emoji-ink:#123b4a;
    --matched:#57a773;
    --matched-glow:rgba(87,167,115,.55);
    --accent:#ffd166;
    --shadow:rgba(4,20,26,.35);
    --font-display:"Fredoka",system-ui,sans-serif;
    --font-ui:"Nunito",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font-ui);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a5a6b 0%, transparent 60%),
      linear-gradient(160deg,var(--board) 0%,var(--board-2) 100%);
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding:clamp(12px,2.5vw,28px);
  }
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px 18px;
    max-width:1000px;
    width:100%;
    margin:0 auto 6px;
  }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.6rem,4vw,2.4rem);
    letter-spacing:.5px;
    margin:0;
    display:flex;
    align-items:center;
    gap:.5rem;
    line-height:1;
  }
  h1 .dot{color:var(--accent);}
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-left:auto;
    align-items:center;
  }
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{
    font-size:.72rem;
    font-weight:700;
    color:var(--ink-soft);
    padding-left:4px;
  }
  select, .btn{
    font-family:var(--font-ui);
    font-weight:700;
    font-size:.95rem;
    color:var(--word-ink);
    background:var(--face);
    border:none;
    border-radius:14px;
    padding:10px 14px;
    cursor:pointer;
    box-shadow:0 3px 0 rgba(4,20,26,.3);
  }
  select{padding-right:32px;}
  .btn{background:var(--accent);}
  .btn:active, select:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(4,20,26,.3);}
  .btn.sound{
    background:var(--panel);
    color:var(--ink);
    box-shadow:0 3px 0 rgba(4,20,26,.4);
    min-width:48px;
  }
  .btn.sound.off{opacity:.6;}
  .btn:focus-visible, select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  .scorebar{
    display:flex;
    gap:22px;
    max-width:1000px;
    width:100%;
    margin:8px auto 14px;
    font-weight:800;
    color:var(--ink-soft);
    font-size:.95rem;
  }
  .scorebar b{color:var(--ink);font-family:var(--font-display);font-size:1.15rem;}

  .board-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;}
  .grid{
    display:grid;
    gap:clamp(8px,1.6vw,16px);
    width:100%;
    max-width:820px;
    margin:0 auto;
  }

  .card{
    position:relative;
    aspect-ratio:3/4;
    border:none;
    background:transparent;
    padding:0;
    cursor:pointer;
    perspective:900px;
    font-family:var(--font-display);
  }
  .card:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:16px;}
  .inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.25,1);
    border-radius:16px;
  }
  .card.up .inner, .card.matched .inner{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow:0 5px 0 var(--shadow);
    overflow:hidden;
  }
  .back{
    background:linear-gradient(150deg,var(--cardback),var(--cardback-2));
    color:#fff;
  }
  .back::after{
    content:"?";
    font-size:clamp(1.8rem,6vw,3rem);
    font-weight:700;
    opacity:.9;
    text-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .front{
    transform:rotateY(180deg);
    background:var(--face);
    flex-direction:column;
    gap:.15em;
    padding:6px;
  }
  .front.word{background:var(--face-word);}
  .emoji{font-size:clamp(2.2rem,9vw,4rem);line-height:1;}
  .word{
    color:var(--word-ink);
    font-weight:600;
    font-size:clamp(1rem,3.4vw,1.7rem);
    line-height:1.05;
    word-break:break-word;
  }
  .front .mini{font-size:clamp(1.1rem,3.5vw,1.6rem);line-height:1;opacity:0;height:0;transition:opacity .3s;}
  .card.matched .front .mini{opacity:1;height:auto;margin-bottom:.05em;}

  .card.matched .front{
    box-shadow:0 0 0 3px var(--matched), 0 0 22px var(--matched-glow), 0 5px 0 var(--shadow);
  }
  .card.matched{cursor:default;animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.07);}100%{transform:scale(1);}}
  .card.speaking .front{box-shadow:0 0 0 3px var(--accent),0 0 22px rgba(255,209,102,.6),0 5px 0 var(--shadow);}

  .win{
    max-width:1000px;width:100%;margin:0 auto 14px;
    background:var(--panel);
    border-radius:18px;
    padding:16px 20px;
    display:none;
    align-items:center;
    gap:14px;
    box-shadow:0 5px 0 rgba(4,20,26,.4);
    animation:pop .4s ease;
  }
  .win.show{display:flex;}
  .win .emoji{font-size:2.2rem;}
  .win .txt{font-family:var(--font-display);font-size:1.3rem;font-weight:600;}
  .win .txt small{display:block;font-family:var(--font-ui);font-weight:700;color:var(--ink-soft);font-size:.85rem;}

  .hint{
    max-width:1000px;width:100%;margin:0 auto;
    color:var(--ink-soft);font-weight:600;font-size:.85rem;text-align:center;
  }

  @media (max-width:520px){
    .controls{width:100%;margin-left:0;}
    .field{flex:1;}
    select,.btn{width:100%;}
    .btn.sound{max-width:60px;}
  }
  @media (prefers-reduced-motion:reduce){
    .inner{transition:none;}
    .card.matched,.win{animation:none;}
  }
</style>
</head>
<body>
  <header>
    <h1><span>Word Match</span><span class="dot">✦</span></h1>
    <div class="controls">
      <div class="field">
        <label for="cat">Topic</label>
        <select id="cat" aria-label="Choose a topic"></select>
      </div>
      <div class="field">
        <label for="pairs">Pairs</label>
        <select id="pairs" aria-label="Choose number of pairs">
          <option value="4">4 (easy)</option>
          <option value="6" selected>6</option>
          <option value="8">8 (hard)</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" id="newgame">New game</button>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn sound" id="sound" aria-label="Toggle sound" title="Sound on/off">🔊</button>
      </div>
    </div>
  </header>

  <div class="scorebar">
    <span>Matches <b id="matches">0</b></span>
    <span>Tries <b id="tries">0</b></span>
  </div>

  <div class="win" id="win">
    <span class="emoji">🎉</span>
    <span class="txt">Great job!<small id="winsub"></small></span>
    <button class="btn" id="again" style="margin-left:auto;">Play again</button>
  </div>

  <div class="board-wrap">
    <div class="grid" id="grid" aria-label="Memory game board"></div>
  </div>

  <p class="hint">Flip two cards. Match the picture with the word. Tap a matched word to hear it.</p>

<script>
const DECKS = {
  "Classroom":[
    ["✏️","pencil"],["📚","book"],["✂️","scissors"],["🖍️","crayon"],
    ["🎒","backpack"],["🪑","chair"],["🖊️","pen"],["📏","ruler"]
  ],
  "Colors":[
    ["🔴","red"],["🔵","blue"],["🟢","green"],["🟡","yellow"],
    ["🟠","orange"],["🟣","purple"],["⚫","black"],["⚪","white"]
  ],
  "Food":[
    ["🍎","apple"],["🍌","banana"],["🍞","bread"],["🥛","milk"],
    ["🍚","rice"],["🥚","egg"],["🧀","cheese"],["🍗","chicken"]
  ],
  "Animals":[
    ["🐶","dog"],["🐱","cat"],["🐟","fish"],["🐦","bird"],
    ["🐴","horse"],["🐄","cow"],["🐷","pig"],["🐔","hen"]
  ],
  "My body":[
    ["👁️","eye"],["👂","ear"],["👃","nose"],["👄","mouth"],
    ["✋","hand"],["🦶","foot"],["💪","arm"],["🦷","tooth"]
  ],
  "Family":[
    ["👩","mother"],["👨","father"],["👧","sister"],["👦","brother"],
    ["👶","baby"],["👵","grandma"],["👴","grandpa"],["👪","family"]
  ],
  "Numbers":[
    ["1️⃣","one"],["2️⃣","two"],["3️⃣","three"],["4️⃣","four"],
    ["5️⃣","five"],["6️⃣","six"],["7️⃣","seven"],["8️⃣","eight"]
  ]
};

const grid=document.getElementById('grid');
const catSel=document.getElementById('cat');
const pairsSel=document.getElementById('pairs');
const matchesEl=document.getElementById('matches');
const triesEl=document.getElementById('tries');
const winEl=document.getElementById('win');
const winSub=document.getElementById('winsub');
const soundBtn=document.getElementById('sound');

let first=null, lock=false, matches=0, tries=0, totalPairs=0, soundOn=true;

Object.keys(DECKS).forEach(k=>{
  const o=document.createElement('option');o.value=k;o.textContent=k;catSel.appendChild(o);
});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function speak(word){
  if(!soundOn||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';u.rate=.8;u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

function newGame(){
  const deck=DECKS[catSel.value];
  totalPairs=Math.min(parseInt(pairsSel.value,10),deck.length);
  matches=0;tries=0;first=null;lock=false;
  matchesEl.textContent=0;triesEl.textContent=0;
  winEl.classList.remove('show');
  grid.innerHTML='';

  const chosen=shuffle([...deck]).slice(0,totalPairs);
  let cards=[];
  chosen.forEach(([emoji,word],idx)=>{
    cards.push({id:idx,type:'emoji',emoji,word});
    cards.push({id:idx,type:'word',emoji,word});
  });
  shuffle(cards);

  const cols=cards.length<=8?4:(cards.length<=12?4:4);
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;

  cards.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='card';
    btn.setAttribute('aria-label','hidden card');
    btn.dataset.id=c.id;btn.dataset.type=c.type;btn.dataset.word=c.word;
    const front = c.type==='emoji'
      ? `<div class="front"><span class="emoji">${c.emoji}</span></div>`
      : `<div class="front word"><span class="mini">${c.emoji}</span><span class="word">${c.word}</span></div>`;
    btn.innerHTML=`<div class="inner"><div class="face back"></div>${front}</div>`;
    btn.addEventListener('click',()=>flip(btn));
    grid.appendChild(btn);
  });
}

function flip(btn){
  if(lock||btn.classList.contains('up')||btn.classList.contains('matched'))return;
  btn.classList.add('up');
  btn.setAttribute('aria-label',btn.dataset.word);
  if(btn.dataset.type==='emoji') speak(btn.dataset.word);

  if(!first){first=btn;return;}

  tries++;triesEl.textContent=tries;
  lock=true;
  const isMatch=first.dataset.id===btn.dataset.id;

  if(isMatch){
    setTimeout(()=>{
      [first,btn].forEach(c=>{c.classList.add('matched');c.classList.remove('up');});
      const wordCard=[first,btn].find(c=>c.dataset.type==='word')||btn;
      wordCard.classList.add('speaking');
      speak(btn.dataset.word);
      setTimeout(()=>wordCard.classList.remove('speaking'),700);
      matches++;matchesEl.textContent=matches;
      first=null;lock=false;
      if(matches===totalPairs)finish();
    },350);
  }else{
    setTimeout(()=>{
      [first,btn].forEach(c=>{c.classList.remove('up');c.setAttribute('aria-label','hidden card');});
      first=null;lock=false;
    },950);
  }
}

function finish(){
  winSub.textContent=`${totalPairs} words · ${tries} tries`;
  winEl.classList.add('show');
}

// tap a matched word/emoji to hear it again
grid.addEventListener('click',e=>{
  const card=e.target.closest('.card.matched');
  if(card){speak(card.dataset.word);
    if(card.dataset.type==='word'){card.classList.add('speaking');setTimeout(()=>card.classList.remove('speaking'),700);}
  }
});

soundBtn.addEventListener('click',()=>{
  soundOn=!soundOn;
  soundBtn.textContent=soundOn?'🔊':'🔇';
  soundBtn.classList.toggle('off',!soundOn);
  if(!soundOn&&'speechSynthesis' in window)speechSynthesis.cancel();
});

document.getElementById('newgame').addEventListener('click',newGame);
document.getElementById('again').addEventListener('click',newGame);
catSel.addEventListener('change',newGame);
pairsSel.addEventListener('change',newGame);

newGame();
</script>
</body>
</html>
